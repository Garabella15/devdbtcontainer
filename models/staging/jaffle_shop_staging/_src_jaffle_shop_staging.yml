version: 2

sources:
  - name: jaffle_shop
    description: A clone of a postgres database
    database: "{{target.database}}"
    schema: jaffle_shop
    tables:
      - name: customers
        description: raw customer data
        columns:
          - name: id
            description: The primary key.
            data_tests:
              - unique
              - not_null
        
      - name: orders
        description: One record per order (consisting of one or more order items)
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 2
              period: day
          loaded_at_field: convert_timezone('UTC', _etl_loaded_at::timestamp_ntz)
